# Cross-platform task runner (https://taskfile.dev). Run from repo root: `task <name>`.
version: "3"

vars:
  HARNESS: ./harness
  MUXON: ./harness/cmd/muxon

tasks:
  default:
    cmds:
      - task --list
    silent: true

  build:
    desc: Build harness/muxon binary
    cmds:
      - go build -o harness/muxon{{exeExt}} {{.MUXON}}

  muxon:
    desc: go run muxon CLI (pass args after --, e.g. task muxon -- run -p "hi")
    cmds:
      - go run {{.MUXON}} {{.CLI_ARGS}}

  test:
    desc: go test ./harness/...
    cmds:
      - go test ./harness/...

  vet:
    desc: go vet ./harness/...
    cmds:
      - go vet ./harness/...

  fmt:
    desc: gofmt harness/
    cmds:
      - gofmt -w {{.HARNESS}}

  lint:
    desc: golangci-lint run (in harness/)
    dir: harness
    cmds:
      - golangci-lint run

  eval:
    desc: OpenCode Go basket
    dir: harness
    cmds:
      - go run ./cmd/muxon eval basket --matrix testdata/eval/matrix-opencode.yaml --tasks 'testdata/eval/*.json' --trials 1 --concurrency 2 --budget-usd 5 --trust
