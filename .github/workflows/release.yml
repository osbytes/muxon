# Release: on a version tag (v1.2.3), build the thee binaries with goreleaser (.goreleaser.yml),
# attest them, and publish the GitHub release. The body is this version's CHANGELOG.md section.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# read-only by default; the release job takes exactly the write scopes it needs
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the GitHub release
      id-token: write      # sign the build provenance attestation (Sigstore, via GitHub OIDC)
      attestations: write  # store it on the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Version
        id: v
        run: |
          # tag names may only be versions: nothing else ever reaches a shell
          case "$GITHUB_REF_NAME" in v[0-9]*.[0-9]*.[0-9]*) ;; *) [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || { echo "not a version tag: $GITHUB_REF_NAME"; exit 1; } ;; esac
          pkg=$(node -p "require('./package.json').version")
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] && [ "v$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json $pkg"; exit 1
          fi
          echo "version=$(printf %s "$pkg" | tr -cd 'A-Za-z0-9.+-')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: harness/go.mod
          cache-dependency-path: harness/go.sum

      # the release body is this version's CHANGELOG.md section (what changesets wrote), not the tag message
      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: node scripts/release-notes.mjs "$VERSION" > "$RUNNER_TEMP/release-notes.md" && cat "$RUNNER_TEMP/release-notes.md"

      # only version tags publish; a manual run builds a snapshot and attests nothing
      - name: Build snapshot
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --clean --snapshot
      - name: Build and publish
        if: startsWith(github.ref, 'refs/tags/v')
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --clean --release-notes ${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # `gh attestation verify thee_linux_amd64.tar.gz --owner adavila0703` proves an archive came
      # from this workflow in this repository
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
