<svg xmlns="http://www.w3.org/2000/svg" width="680" height="290" viewBox="0 0 680 290" role="img">
  <title>muxon</title>
  <desc>Four input lines converge into one output line with a dot on it, above the wordmark muxon.</desc>
  <style>
    .ink { stroke: #5F5E5A; }
    .dot { fill: #5F5E5A; }
    .word { fill: #1F1E1D; font: 500 48px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tag { fill: #5F5E5A; font: 400 14px system-ui, -apple-system, "Segoe UI", sans-serif; }
    @media (prefers-color-scheme: dark) {
      .ink { stroke: #B4B2A9; }
      .dot { fill: #B4B2A9; }
      .word { fill: #F1EFE8; }
      .tag { fill: #B4B2A9; }
    }
  </style>
  <g class="ink" fill="none" stroke-width="3" stroke-linecap="round">
    <path d="M180 60 C250 60 270 110 330 110"/>
    <path d="M180 90 C240 90 270 110 330 110"/>
    <path d="M180 130 C240 130 270 110 330 110"/>
    <path d="M180 160 C250 160 270 110 330 110"/>
  </g>
  <circle class="dot" cx="180" cy="60" r="5"/>
  <circle class="dot" cx="180" cy="90" r="5"/>
  <circle class="dot" cx="180" cy="130" r="5"/>
  <circle class="dot" cx="180" cy="160" r="5"/>
  <path d="M330 110 H500" fill="none" stroke="#7F77DD" stroke-width="5" stroke-linecap="round"/>
  <circle cx="430" cy="110" r="20" fill="none" stroke="#7F77DD" stroke-width="2"/>
  <circle cx="430" cy="110" r="10" fill="#7F77DD"/>
  <text class="word" x="340" y="228" text-anchor="middle">muxon</text>
  <text class="tag" x="340" y="256" text-anchor="middle">many models in, one agent out</text>
</svg>
